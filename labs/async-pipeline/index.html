<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>async-pipeline · Vanilla JS Labs</title>
  <link rel="stylesheet" href="../../styles/base.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="../../">
        <span class="brand-mark" aria-hidden="true"></span>
        labs / async-pipeline
      </a>
      <nav class="nav">
        <a href="../signal-store/">signal-store</a>
        <a href="../observer-board/">observer-board</a>
        <a href="../../">home</a>
      </nav>
    </header>

    <section class="lab-hero">
      <div>
        <p class="kicker">02 · async</p>
        <h1 class="display">Fetch que aguenta<br />tropeço.</h1>
        <p class="lede">
          Timeout, retry com backoff, AbortController e estados claros.
          Troca o endpoint, força falha, cancela no meio.
        </p>
      </div>
      <div class="panel status-card" id="statusCard" data-state="idle">
        <span class="mono label">status</span>
        <strong id="statusText">idle</strong>
        <p id="statusDetail">ainda não rodou</p>
      </div>
    </section>

    <section class="workspace">
      <form class="panel controls" id="runForm">
        <label>
          endpoint
          <select id="endpoint">
            <option value="users">jsonplaceholder / users</option>
            <option value="posts">jsonplaceholder / posts</option>
            <option value="fail">endpoint que falha</option>
            <option value="slow">endpoint lento (precisa abort/timeout)</option>
          </select>
        </label>

        <div class="row">
          <label>
            timeout (ms)
            <input id="timeoutMs" type="number" min="300" step="100" value="2500" />
          </label>
          <label>
            retries
            <input id="retries" type="number" min="0" max="4" value="2" />
          </label>
        </div>

        <div class="actions">
          <button class="btn btn-primary" type="submit" id="runBtn">rodar pipeline</button>
          <button class="btn btn-ghost" type="button" id="abortBtn">abort</button>
        </div>

        <ol id="trace" class="trace" aria-live="polite"></ol>
      </form>

      <div class="panel result">
        <div class="result-head">
          <span class="mono">payload</span>
          <span class="mono" id="meta">—</span>
        </div>
        <pre id="output" class="output">// resultado aparece aqui</pre>
      </div>
    </section>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
